---
- name: Validate local project files
  hosts: local
  gather_facts: false
  vars:
    project_root: "{{ playbook_dir }}/.."
  tasks:
    - name: Check required router configurations
      ansible.builtin.stat:
        path: "{{ project_root }}/configs/frr/{{ item }}/frr.conf"
      loop:
        - edge-malmo
        - edge-london
      register: router_configs

    - name: Assert router configurations exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "Missing FRR configuration"
      loop: "{{ router_configs.results }}"

    - name: Check Docker Compose configuration
      ansible.builtin.command:
        cmd: docker compose config --quiet
        chdir: "{{ project_root }}"
      changed_when: false
