---
- name: Back up local router configurations
  hosts: local
  gather_facts: true
  vars:
    project_root: "{{ playbook_dir }}/.."
    backup_root: "{{ project_root }}/backups/{{ ansible_date_time.iso8601_basic_short }}"
  tasks:
    - name: Create backup directory
      ansible.builtin.file:
        path: "{{ backup_root }}"
        state: directory
        mode: "0755"

    - name: Copy router configuration directories
      ansible.builtin.copy:
        src: "{{ project_root }}/configs/frr/{{ item }}"
        dest: "{{ backup_root }}/"
        mode: preserve
      loop:
        - edge-malmo
        - edge-london

    - name: Report backup path
      ansible.builtin.debug:
        msg: "Backup saved to {{ backup_root }}"
