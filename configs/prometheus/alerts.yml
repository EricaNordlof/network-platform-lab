groups:
  - name: network-platform-lab
    rules:
      - alert: HttpProbeFailed
        expr: probe_success == 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "HTTP probe failed"
          description: "{{ $labels.instance }} has failed HTTP probes for 30 seconds."

      - alert: ApiUnavailable
        expr: up{job="network-platform-api"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Network Platform API unavailable"
          description: "Prometheus cannot scrape the API."
